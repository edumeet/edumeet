# Publish a GitHub Release for each rolling stable release.
#
# A release is documented by its "## [<version>-stable] - <date>" section in
# CHANGELOG.md. When that section reaches main, this workflow tags the commit
# with the version and creates the GitHub Release from the section, so the
# repository page shows the current rolling release as "Latest".
#
# For the newest release it also moves the "latest" tag of the edumeet images
# on Docker Hub to that version, so `docker pull edumeet/<image>` gets the
# current release. The images must be pushed with the version tag before the
# changelog section is merged, and docker-compose.yml must pin that version;
# the job stops before creating the release when either is missing. Moving
# "latest" needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.
#
# It can also be started by hand (Actions > Release > Run workflow) for one
# version, e.g. to recreate notes. A release that already exists is skipped,
# but "latest" is still moved when it is the newest one, so a run can be
# repeated to fix the tag.
name: Release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .github/workflows/release.yml
      - .github/scripts/release-notes.sh
  workflow_dispatch:
    inputs:
      version:
        description: Changelog version to release, e.g. 4.2-20261118-stable (empty = newest)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGES: edumeet-client edumeet-room-server edumeet-media-node edumeet-management-server
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          script=.github/scripts/release-notes.sh
          newest="$(bash "$script" --latest-version)"
          version="${INPUT_VERSION:-$newest}"

          if [ -z "$version" ]; then
            echo "No *-stable release in CHANGELOG.md"
            exit 1
          fi
          case "$version" in
            *-stable) ;;
            *) echo "Only *-stable versions are released: $version"; exit 1 ;;
          esac

          latest=false
          [ "$version" = "$newest" ] && latest=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Check docker-compose.yml and the images
        if: steps.version.outputs.latest == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          wrong="$(grep -E '^[[:space:]]*image:[[:space:]]*edumeet/' docker-compose.yml \
            | grep -vE ":${VERSION}[[:space:]]*\$" || true)"
          if [ -n "$wrong" ]; then
            echo "docker-compose.yml must pin the edumeet images to $VERSION:"
            echo "$wrong"
            exit 1
          fi
          for image in $IMAGES; do
            if ! docker buildx imagetools inspect "edumeet/$image:$VERSION" >/dev/null; then
              echo "edumeet/$image:$VERSION is not on Docker Hub; push it first"
              exit 1
            fi
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, nothing to do"
            exit 0
          fi

          bash .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest="$LATEST"
          echo "Published $VERSION (latest: $LATEST)"

      - name: Log in to Docker Hub
        if: steps.version.outputs.latest == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move the latest tag on Docker Hub
        if: steps.version.outputs.latest == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Copies the manifest (list) on the registry: nothing is rebuilt and
          # every platform of the version keeps its digest.
          for image in $IMAGES; do
            docker buildx imagetools create \
              --tag "edumeet/$image:latest" "edumeet/$image:$VERSION"
            echo "edumeet/$image:latest -> $VERSION"
          done
