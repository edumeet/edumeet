version: '3.8'
services:
  proxy:
    image: nginx
    restart: unless-stopped
    volumes:
     - ./proxy:/etc/nginx/templates
     - ./certbot/conf:/etc/letsencrypt
     - ./certbot/www:/var/www/certbot
    ports:
     - "80:80/tcp"
     - "443:443/tcp"
     - "443:443/udp"
    links:
     - edumeet-room-server
     - edumeet-client
    environment:
     - MAIN_DOMAIN=${MAIN_DOMAIN}
     - MEDIA_DOMAIN=${MEDIA_DOMAIN}
     - LISTEN_IP=${LISTEN_IP}
    command: "/bin/sh -c 'envsubst \"\\$${MAIN_DOMAIN},\\$${LISTEN_IP},\\$${MEDIA_DOMAIN}\" < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
     - ./certbot/conf:/etc/letsencrypt
     - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  turn:
    image: coturn/coturn
    restart: unless-stopped
    network_mode: host
    environment:
     - EXTERNAL_IP=${EXTERNAL_IP}
     - LISTEN_IP=${LISTEN_IP}
     - MEDIA_SECRET=${MEDIA_SECRET}
    # LOCAL_IP is this host's own address, the private one behind NAT. coturn maps EXTERNAL_IP to
    # it and allows it as a peer, so the media node on this host stays reachable. It must never be
    # 0.0.0.0: coturn then allows every peer.
    command: >
      -n
      --min-port=50000
      --max-port=60000
      --realm=${MEDIA_DOMAIN}
      --external-ip=${EXTERNAL_IP}/${LOCAL_IP:-${EXTERNAL_IP}}
      --external-ip=${EXTERNAL_IP}
      --listening-ip=${LISTEN_IP}
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${MEDIA_SECRET}
      --no-tls
      --no-multicast-peers
      --no-tcp-relay
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=::1
      --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --allowed-peer-ip=${EXTERNAL_IP}
      --user-quota=12
  edumeet-client:
    image: edumeet/edumeet-client
    restart: unless-stopped
    volumes:
     - ./client:/app/config
    # Reached by the proxy over the compose network; published on the host's loopback only.
    ports:
     - "127.0.0.1:8080:80"
  edumeet-room-server:
    image: edumeet/edumeet-room-server
    restart: unless-stopped
    volumes:
     # Only the template: the config.json built from it holds MEDIA_SECRET and stays in the container.
     - ./room-server/config.json.template:/usr/src/app/config/config.json.template:ro
    environment:
     - TEMPLATE_REPLACE=true
     - LISTEN_IP=${LISTEN_IP}
     - MEDIA_SECRET=${MEDIA_SECRET}
     - MEDIA_DOMAIN=${MEDIA_DOMAIN}
    # Only through the proxy, which sets X-Forwarded-For: published on the host's loopback only,
    # so no client can reach the room server directly and choose its own address.
    ports:
     - "127.0.0.1:8443:8443"
  edumeet-media-node:
    image: edumeet/edumeet-media-node
    restart: unless-stopped
    environment:
     - MEDIA_SECRET=${MEDIA_SECRET}
     - EXTERNAL_IP=${EXTERNAL_IP}
     - LISTEN_IP=${LISTEN_IP}
    network_mode: host
    command: >
      --ip ${LISTEN_IP}
      --announcedIp ${EXTERNAL_IP}
      --secret ${MEDIA_SECRET}
